# Docker Compose para desarrollo local
# Incluye: ClickHouse, PostgreSQL, Kafka, Zookeeper, Prometheus, Superset

services:
  # =====================================================
  # CLICKHOUSE - OLAP Database
  # =====================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: geo-retail-clickhouse
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native protocol
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../database/schema:/docker-entrypoint-initdb.d:ro
    environment:
      CLICKHOUSE_DB: geo_retail_analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geo-retail-network

  # =====================================================
  # POSTGRESQL - Conversation History
  # =====================================================
  postgres:
    image: postgres:16-alpine
    container_name: geo-retail-postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: geo_retail_chat
      POSTGRES_USER: geocom
      POSTGRES_PASSWORD: g3oc@m*2026
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geocom -d geo_retail_chat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geo-retail-network

  # =====================================================
  # ZOOKEEPER - Kafka Coordination
  # =====================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: geo-retail-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geo-retail-network

  # =====================================================
  # KAFKA - Event Streaming
  # =====================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: geo-retail-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - geo-retail-network

  # =====================================================
  # KAFKA UI - Web Interface
  # =====================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: geo-retail-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: geo-retail
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - geo-retail-network

  # =====================================================
  # PROMETHEUS - Metrics Collection
  # =====================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: geo-retail-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geo-retail-network

  # =====================================================
  # SUPERSET - BI & Dashboards (Apache 2.0 License)
  # =====================================================
  superset-db:
    image: postgres:16-alpine
    container_name: geo-retail-superset-db
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - superset_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geo-retail-network

  superset-cache:
    image: redis:7-alpine
    container_name: geo-retail-superset-cache
    volumes:
      - superset_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geo-retail-network

  superset:
    image: apache/superset:3.1.0
    container_name: geo-retail-superset
    depends_on:
      superset-db:
        condition: service_healthy
      superset-cache:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-your-secret-key-change-in-production}
      DATABASE_URL: postgresql://superset:superset@superset-db:5432/superset
      REDIS_URL: redis://superset-cache:6379/0
      SUPERSET_LOAD_EXAMPLES: "no"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    command: >
      bash -c "
        superset db upgrade &&
        superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password admin || true &&
        superset init &&
        superset run -h 0.0.0.0 -p 8088 --with-threads
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - geo-retail-network

  # =====================================================
  # OLLAMA - LLM local (opcional, puede correr en host)
  # =====================================================
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: geo-retail-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   # Uncomment for GPU support
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: all
  #   #           capabilities: [gpu]
  #   networks:
  #     - geo-retail-network

volumes:
  clickhouse_data:
  postgres_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  prometheus_data:
  superset_db_data:
  superset_cache_data:
  # ollama_data:

networks:
  geo-retail-network:
    driver: bridge
    name: geo-retail-network
