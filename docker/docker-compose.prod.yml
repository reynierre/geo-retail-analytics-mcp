# Docker Compose para Producción
# Incluye: ClickHouse, Kafka, Zookeeper, Prometheus, Superset con limits y replicas

services:
  # =====================================================
  # CLICKHOUSE - OLAP Database (Production)
  # =====================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: geo-retail-clickhouse-prod
    restart: always
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - /data/clickhouse:/var/lib/clickhouse
      - /data/clickhouse/backups:/backups
      - ../database/schema:/docker-entrypoint-initdb.d:ro
    environment:
      CLICKHOUSE_DB: geo_retail_analytics
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geo-retail-network-prod

  # =====================================================
  # POSTGRESQL - Conversation History (Production)
  # =====================================================
  postgres:
    image: postgres:16-alpine
    container_name: geo-retail-postgres-prod
    restart: always
    ports:
      - "5434:5432"
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: geo_retail_chat
      POSTGRES_USER: ${POSTGRES_USER:-geocom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geocom} -d geo_retail_chat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geo-retail-network-prod

  # =====================================================
  # ZOOKEEPER - Kafka Coordination (Production)
  # =====================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: geo-retail-zookeeper-prod
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - /data/zookeeper/data:/var/lib/zookeeper/data
      - /data/zookeeper/log:/var/lib/zookeeper/log
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    networks:
      - geo-retail-network-prod

  # =====================================================
  # KAFKA - Event Streaming (Production)
  # =====================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: geo-retail-kafka-prod
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
    volumes:
      - /data/kafka:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    networks:
      - geo-retail-network-prod

  # =====================================================
  # PROMETHEUS - Metrics Collection (Production)
  # =====================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: geo-retail-prometheus-prod
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    networks:
      - geo-retail-network-prod

  # =====================================================
  # SUPERSET - BI & Dashboards (Production) (Apache 2.0 License)
  # =====================================================
  superset-db:
    image: postgres:16-alpine
    container_name: geo-retail-superset-db-prod
    restart: always
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD}
    volumes:
      - /data/superset/db:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geo-retail-network-prod

  superset-cache:
    image: redis:7-alpine
    container_name: geo-retail-superset-cache-prod
    restart: always
    volumes:
      - /data/superset/cache:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geo-retail-network-prod

  superset:
    image: apache/superset:3.1.0
    container_name: geo-retail-superset-prod
    restart: always
    depends_on:
      superset-db:
        condition: service_healthy
      superset-cache:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      DATABASE_URL: postgresql://superset:${SUPERSET_DB_PASSWORD}@superset-db:5432/superset
      REDIS_URL: redis://superset-cache:6379/0
      SUPERSET_LOAD_EXAMPLES: "no"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    command: >
      bash -c "
        superset db upgrade &&
        superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password ${SUPERSET_ADMIN_PASSWORD:-admin} || true &&
        superset init &&
        superset run -h 0.0.0.0 -p 8088 --with-threads
      "
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - geo-retail-network-prod

  # =====================================================
  # OLLAMA - LLM Local (Production)
  # =====================================================
  ollama:
    image: ollama/ollama:latest
    container_name: geo-retail-ollama-prod
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - /data/ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 16G
        reservations:
          memory: 8G
    # Uncomment for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    networks:
      - geo-retail-network-prod

networks:
  geo-retail-network-prod:
    driver: bridge
    name: geo-retail-network-prod
